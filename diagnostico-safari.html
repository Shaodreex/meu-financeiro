<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Diagnóstico Safari — Meu Financeiro</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f4f6f8;color:#172033;margin:0;padding:24px}.card{max-width:680px;margin:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 30px #0001}.row{padding:10px 0;border-bottom:1px solid #e8ebef}.ok{color:#067647}.bad{color:#b42318}code{word-break:break-all}button{margin-top:18px;padding:12px 16px;border:0;border-radius:10px;background:#172033;color:#fff;font-weight:700}</style></head><body><div class="card"><h1>Diagnóstico do Safari</h1><p>Esta página não depende do aplicativo. Ela verifica somente os componentes necessários para iniciar.</p><div id="out"></div><button onclick="location.href='./?diag='+Date.now()">Abrir Meu Financeiro</button></div>
<script>
(function(){var out=document.getElementById('out');function row(label,ok,detail){var d=document.createElement('div');d.className='row';d.innerHTML='<strong>'+label+': </strong><span class="'+(ok?'ok':'bad')+'">'+(ok?'OK':'FALHA')+'</span>'+(detail?'<br><code>'+String(detail).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</code>':'');out.appendChild(d)}
row('JavaScript',true,navigator.userAgent);try{localStorage.setItem('mf_diag','1');row('LocalStorage',localStorage.getItem('mf_diag')==='1');localStorage.removeItem('mf_diag')}catch(e){row('LocalStorage',false,e.message)}
Promise.all([fetch('supabase-lite.js?v=284',{cache:'no-store'}),fetch('app.js?v=284',{cache:'no-store'}),fetch('styles.css?v=284',{cache:'no-store'}),fetch('supabase-config.js?v=284',{cache:'no-store'})]).then(function(rs){['Cliente Supabase local','app.js','styles.css','supabase-config.js'].forEach(function(n,i){row(n,rs[i].ok,'HTTP '+rs[i].status)})}).catch(function(e){row('Arquivos do projeto',false,e.message)});
})();</script></body></html>
